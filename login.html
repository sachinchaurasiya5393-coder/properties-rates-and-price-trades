<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - T.Home</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <section class="login-header">

        <div class="login-box" role="region" aria-label="Authentication box">
            <div class="content">
            <div class="tab-content active" id="login" role="tabpanel">
                <form id="login-form">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" placeholder="you@example.com" required>

                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" placeholder="Password" required>

                    <div class="form-msg" aria-live="polite"></div>
                    <button type="submit" class="primary-btn">Login</button>
                </form>
            </div>

            <div class="tab-content" id="register" role="tabpanel" aria-hidden="true">
                <form id="register-form">
                    <label for="reg-name">Full name</label>
                    <input id="reg-name" type="text" placeholder="Your name" required>

                    <label for="reg-email">Email</label>
                    <input id="reg-email" type="email" placeholder="you@example.com" required>

                    <label for="reg-password">Password</label>
                    <input id="reg-password" type="password" placeholder="Password" required>

                    <div class="form-msg" aria-live="polite"></div>
                    <button type="submit" class="primary-btn">Register</button>
                </form>
            </div>

            <div class="tab-content" id="forgot" role="tabpanel" aria-hidden="true">
                <form id="forgot-form">
                    <label for="forgot-email">Email</label>
                    <input id="forgot-email" type="email" placeholder="you@example.com" required>
                    <div class="form-msg" aria-live="polite"></div>
                    <button type="submit" class="primary-btn">Send reset link</button>
                </form>
            </div>

            </div>

            <div class="tabs" role="tablist" aria-label="Authentication tabs">
                <button class="tab active" data-tab="login" role="tab" aria-selected="true">Login</button>
                <button class="tab" data-tab="register" role="tab" aria-selected="false">Register</button>
                <button class="tab" data-tab="forgot" role="tab" aria-selected="false">Forgot</button>
            </div>

        </div>

    </section>

    <script src="./login.js"></script>
</body>
</html>
